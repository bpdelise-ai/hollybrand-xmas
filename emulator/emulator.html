<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DCA1</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="game"></div>

<script>
  EJS_player = "#game";

  EJS_core = "snes";

  // ✅ Using CDN — no local data/ folder needed
  EJS_pathtodata = "https://cdn.emulatorjs.org/stable/data/";

  // ✅ Path to your ROM relative to this file
  EJS_gameUrl = "../roms/DCA1.smc";

  EJS_startOnLoaded = true;

  EJS_fullscreenOnLoaded = false;

  EJS_disableDatabases = true;

  EJS_defaultOptions = {
    'save-state-location': 'browser'
  };
</script>

<!-- ✅ Loader from CDN — no local loader.js needed -->
<script src="https://cdn.emulatorjs.org/stable/data/loader.js"></script>

</body>
</html>
