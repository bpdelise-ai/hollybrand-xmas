<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DCA3</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: black;
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    #game {
      width: 100vw;
      height: 100vh;
    }
  </style>
</head>

<body>

<div id="game"></div>

<script>
  EJS_player = "#game";

  EJS_core = "snes";

  EJS_pathtodata = "data/";

  EJS_gameUrl = "../roms/DCA3.smc";

  EJS_startOnLoaded = true;

  EJS_fullscreenOnLoaded = false;

  EJS_disableDatabases = true;

  EJS_defaultOptions = {
    'save-state-location': 'browser'
  };
</script>

<script src="loader.js"></script>

</body>
</html>
